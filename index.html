<!DOCTYPE html>
<html lang="en">
<head>
 <meta charset="UTF-8">
  <title>Boston Sports Dashboard</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
	<!-- Controls -->
	<div id="controls">
		<label><input type="checkbox" value="football/nfl" checked> NFL</label>
		<label><input type="checkbox" value="hockey/nhl" checked> NHL</label>
		<label><input type="checkbox" value="baseball/mlb" checked> MLB</label>
		<label><input type="checkbox" value="basketball/nba" checked> NBA</label>
		<label><input type="checkbox" value="soccer/usa.1" checked> MLS</label>
		<label><input type="checkbox" value="racing/f1"> F1</label>
		<label><input type="checkbox" value="ncaa/icehockey-men-d1"> NCAA College Hockey</label>

	  <label style="margin-left:20px;">
		<input type="checkbox" id="bostonMode">
		Boston Only
	  </label>
	  <label style="margin-left:20px;">
		<input type="checkbox" id="liveOnly">		Live Only
	  </label>
	</div>

	<!-- DASHBOARD (NEW) -->
	 <main class="dashboard">
	  <!-- Top row -->
	  
	  <div class="team-card bruins">
		  <div class="team-header">
			<img
			  src="https://a.espncdn.com/i/teamlogos/nhl/500/bos.png"
			  alt="Boston Bruins"
			  class="team-logo"
			/>
			<span class="team-name">Boston Bruins</span>
		  </div>

		  <div class="team-status" id="bruins-status">
			Loading…
		  </div>
		  <div class="team-standings" id="bruins-standings">
			  Loading standings…
		  </div>
	  </div>

	  <div class="team-card redsox">
		  <div class="team-header">
			<img
			  src="https://a.espncdn.com/i/teamlogos/mlb/500/bos.png"
			  alt="Boston Red Sox"
			  class="team-logo"
			/>
			<span class="team-name">Boston Red Sox</span>
		  </div>

		  <div class="team-status" id="redsox-status">
			Loading…
		  </div>
		  <div class="team-standings" id="redsox-standings">
			  Loading standings…
		  </div>
	  </div>
	
	  <div class="team-card patriots">
		  <div class="team-header">
			<img
			  src="https://a.espncdn.com/i/teamlogos/nfl/500/ne.png"
			  alt="New England Patriots"
			  class="team-logo"
			/>
			<span class="team-name">New England Patriots</span>
		  </div>

		  <div class="team-status" id="patriots-status">
			Loading…
		  </div>
		  <div class="team-standings" id="patriots-standings">
			  Loading standings…
		  </div>
	  </div>

	  <!-- Bottom row -->
	  <div class="team-card celtics">
		  <div class="team-header">
			<img
			  src="https://a.espncdn.com/i/teamlogos/nba/500/bos.png"
			  alt="Boston Celtics"
			  class="team-logo"
			/>
			<span class="team-name">Boston Celtics</span>
		  </div>

		  <div class="team-status" id="celtics-status">
			Loading…
		  </div>
		  <div class="team-standings" id="celtics-standings">
			  Loading standings…
		  </div>
	  </div>

	<div class="team-card revolution">
		  <div class="team-header">
			<img
			  src="https://a.espncdn.com/i/teamlogos/soccer/500/189.png"
			  alt="New England Revolution"
			  class="team-logo"
			/>
			<span class="team-name">New England Revolution</span>
		  </div>

		  <div class="team-status" id="revolution-status">
			Loading…
		  </div>
		  <div class="team-standings" id="revolution-standings">
			  Loading standings…
		  </div>
	  </div>


	</main>
	

  
	<!-- TICKER -->
	<title>Sports Ticker</title>
		<link rel="stylesheet" href="style.css">
	  <div class="ticker">
		<div id="ticker-content"></div>
	  </div>
		<script src="app.js"></script>
</body>
</html>
